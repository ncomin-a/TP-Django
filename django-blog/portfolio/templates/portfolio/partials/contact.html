<section id="contacto" class="mb-5">

                    <div class="mb-3">

                        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="ncomin@alumno.huergo.edu.ar" required>
                    </div>
                    <div class="mb-3">
                        <label for="mensaje" class="form-label fw-bold">Mensaje</label>
                        <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribí tu mensaje..." required></textarea>

            </div>
        </div>

        <div class="col-md-6 ps-md-4 d-flex flex-column justify-content-center">

            <div class="d-flex flex-column gap-3">
                <a href="https://github.com/ncomin-a" target="_blank" rel="noopener noreferrer" class="custom-card p-3 text-decoration-none d-flex align-items-center">
                    <i class="bi bi-github fs-3 me-3 text-primary"></i>
                    <div>
                        <h6 class="fw-bold mb-0 text-body">GitHub</h6>
                        <small class="text-muted">ncomin-a</small>
                    </div>
                </a>
                <a href="mailto:ncomin@alumno.huergo.edu.ar" class="custom-card p-3 text-decoration-none d-flex align-items-center">
                    <i class="bi bi-envelope-at-fill fs-3 me-3 text-primary"></i>
                    <div>
                        <h6 class="fw-bold mb-0 text-body">Email</h6>
                        <small class="text-muted">ncomin@alumno.huergo.edu.ar</small>
                    </div>
                </a>
            </div>
        </div>
    </div>
</section>
